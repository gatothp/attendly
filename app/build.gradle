plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.qrscanner.sheets'
    compileSdk = 35

    defaultConfig {
        applicationId = "com.qrscanner.sheets"
        minSdk = 24
        targetSdk = 35
        versionCode = 3
        versionName = "1.1.1"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ZXing QR / barcode scanner
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // ML Kit Barcode Scanning (for gallery image QR decode)
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // RecyclerView for Table screen
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // HTTP client for Apps Script Web App
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Kotlin coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Lifecycle (lifecycleScope)
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
}
